kind = "web"
previewPath = "/"
title = "Commerce0S"
description = "A bounded, auditable commerce console where AI agents discover products, make decisions, and complete test-mode payments with a clear protocol trail."
version = "1.0.0"
id = "apps/web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23737

[services.development]
run = "pnpm --filter @workspace/commerce0s run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/commerce0s", "run", "build" ]
serve = "static"
publicDir = "apps/web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23737"
BASE_PATH = "/"
