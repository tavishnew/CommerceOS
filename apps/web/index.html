    <script>
      // Pre-paint theme bootstrap — must run before any module script renders.
      // Determines the user's theme from localStorage or system preference and
      // applies the .dark class on <html> so the first paint matches the
      // resolved theme (no FOUC, no light-then-dark flicker on reload).
      (function () {
        try {
          var saved = localStorage.getItem('commerce0s-theme');
          var theme =
            saved === 'dark' || saved === 'light'
              ? saved
              : window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
          document.documentElement.dataset.theme = theme;
        } catch (_) {
          // localStorage unavailable — fall through to light default.
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
